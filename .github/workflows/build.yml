name: Build

on:
  push:
    branches:
      - master
      - support/*
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/build.yml'
      - '**/*.md'
  pull_request:
    branches:
      - master
      - support/*
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/build.yml'
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required by Sonar to get the blame information

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Extract secrets from Keeper
        uses: Keeper-Security/ksm-action@54024615476123015b628a22341850b2087ab297 # v1.3.1
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}
          secrets: |
            ${{ vars.KEEPER_SONARCLOUD_RECORD_ID }}/field/password > env:SONAR_TOKEN

      # TODO Bonita 12.0 GA: remove this step once Bonita 12.0 is released on Maven Central (only needed to resolve runtime snapshots)
      - name: Setup Maven settings
        uses: bonitasoft/maven-settings-action@v2
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - name: Build and test
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          SONAR_TOKEN: ${{env.SONAR_TOKEN}}
        run: ./mvnw -B -ntp verify sonar:sonar

      - name: Stage the actor filter archive
        run: mkdir staging && cp target/*.zip staging

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Actorfilter
          path: staging
